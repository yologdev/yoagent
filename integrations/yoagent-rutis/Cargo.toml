[package]
name = "yoagent-rutis"
version = "0.1.0"
edition = "2021"
resolver = "3"
description = "Extend a yoagent Agent at runtime with rutis plugins: tools, tool policy, turn notes, input filters and events"
license = "MIT"
repository = "https://github.com/yologdev/yoagent"
documentation = "https://docs.rs/yoagent-rutis"
readme = "README.md"
keywords = ["agent", "llm", "plugin", "rutis", "yoagent"]
categories = ["asynchronous", "development-tools"]
authors = ["Yuanhao <yuanhao@yolog.dev>"]
# yoagent's MSRV; rutis 0.5 declares 1.85.
rust-version = "1.86"
# Not published yet; yoagent 0.23.0, the first release with `ToolSource`, is
# what the requirement below needs on crates.io.
publish = false

[dependencies]
# 0.23.0 is the first release with `ToolSource`.
yoagent = { path = "../..", version = "0.23.0" }
# 0.x caret: 0.5.x only (0.6 is breaking). Any rutis minor bump is a
# yoagent-rutis minor bump — its types are part of this crate's API.
rutis = "0.5"
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
# Same crate rutis hands its cancellation tokens out as.
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
