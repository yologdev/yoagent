[package]
name = "clef-worker"
version = "0.0.0"
edition = "2021"
publish = false
description = "A yoagent agent in a Cloudflare Worker, its tool calls gated by Clef through the Workers AI binding"

[lib]
crate-type = ["cdylib"]

# Paths so CI checks this against the code beside it. Outside this repo:
#   yoagent = { version = "0.25", default-features = false, features = ["decision"] }
#   yoagent-workers = "0.2"
[dependencies]
yoagent = { path = "../../../..", default-features = false, features = ["decision"] }
yoagent-workers = { path = "../.." }
worker = "0.8"
async-trait = "0.1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Not `strip = true`: keep the `target_features` section, which wasm-bindgen
# reads.
strip = "debuginfo"

# Its own workspace: not part of yoagent's or yoagent-workers' build.
[workspace]
