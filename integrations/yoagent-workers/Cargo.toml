[package]
name = "yoagent-workers"
version = "0.1.0"
edition = "2021"
resolver = "3"
description = "Run yoagent on Cloudflare Workers through the Worker's own bindings: Workers AI decision models (Clef) via env.AI"
license = "MIT"
repository = "https://github.com/yologdev/yoagent"
documentation = "https://docs.rs/yoagent-workers"
readme = "README.md"
keywords = ["agent", "cloudflare", "workers", "wasm", "yoagent"]
categories = ["wasm", "asynchronous"]
authors = ["Yuanhao <yuanhao@yolog.dev>"]
# Mirrors yoagent's MSRV; not checked by CI (the wasm32 test tooling tracks
# newer compilers).
rust-version = "1.86"

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

# Everything here exists only on wasm32: a binding is a JavaScript object the
# Workers runtime hands the Worker. On other targets the crate is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# 0.24.0 is the first release with `decision::parse_systemone_response`.
yoagent = { path = "../..", version = "0.24.0", default-features = false, features = ["decision"] }
async-trait = "0.1"
js-sys = "0.3"
serde_json = "1"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.76"
