# cargo-mutants configuration (issue #163). Run by `.github/workflows/mutants.yml`
# weekly; the recorded baseline and the triage of survivors live in
# `docs/evals/mutation-baseline.md`.
#
# Run locally with `cargo mutants` (this file is picked up automatically); add
# `--list` to see what would be mutated. A full run is ~14 h on one machine, so
# sample with `--shard 0/10 --sharding round-robin`. `-f <file>` does NOT narrow
# the run while `examine_globs` is set here (27.1.0 examines all of them); to
# run one module, copy this file, edit the globs and pass `--config <copy>`.
# Do not export CARGO_TARGET_DIR while it runs: cargo-mutants builds each `-j`
# job in its own copy of the tree, and they must not share one target dir.

# Only the modules where a silent failure costs most. Scope is deliberate —
# the whole crate is ~5x the mutants and most of it is wire-format code that
# mock-provider tests already pin byte-for-byte.
examine_globs = [
    # Compaction, truncation, the context tracker, execution limits.
    "src/context.rs",
    # The loop itself: tool dispatch, steering, stop conditions, stats.
    "src/agent_loop.rs",
    # The LlmCompaction state machine.
    "src/llm_compaction.rs",
    # Pricing arithmetic (`CostConfig::cost_usd`, context tiers) and the
    # construction-time lookup (`priced`, `reprice`, `with_prices`).
    "src/provider/model.rs",
    # Since 0.20 prices are data: validation, layering and change reports.
    "src/provider/prices.rs",
    # The process-wide layer resolution every constructor reads through.
    "src/provider/prices/global.rs",
    # SigV4 signing for Bedrock: a wrong byte is a rejected request or a leak.
    "src/provider/sigv4.rs",
    # read_file / write_file: the partial-read guard, the per-file lock and
    # the image header checks (a wrong offset sends an image a provider
    # refuses, which fails every later request).
    "src/tools/file.rs",
    # Not `prices/fetch.rs`: it is opt-in (never fetched implicitly), and a
    # mis-mapped fetch is caught by `tests/price_audit.rs` against models.dev.
]

# Build and test the way CI does. Nothing listed above is feature-gated, but the
# `decision` and `gasp` tests drive the loop (decision spend in `LoopScope`,
# the event stream the GASP recorder consumes) and so can kill loop mutants.
all_features = true

# `profile.mutants` in Cargo.toml: the test profile at opt-level 1 without debug
# info. `tests/context_cache_test.rs` replays 2400-turn sessions and dominates
# an unoptimised run; measured locally this cut the per-mutant test time from
# ~109 s to ~57 s for ~8 s more incremental build.
profile = "mutants"

# Unit + integration tests only, for both the build and the test phase: doctests
# and examples are skipped. Recompiling every doctest cost ~3 minutes per
# mutant, more than everything else together, and the doctests here are usage
# examples rather than assertions about these modules; examples have no tests.
additional_cargo_args = ["--tests"]

# Mutants must not become "unviable" just because a mutation leaves a variable
# unused under a deny-warnings RUSTFLAGS.
cap_lints = true

# Auto-set timeout = multiplier x the unmutated test time. A mutant that turns
# a loop bound into an infinite loop must time out, not hang the shard.
timeout_multiplier = 3.0
minimum_test_timeout = 60

# Known-acceptable survivors. Each entry must say why the mutant cannot matter.
# Keep this list short: anything that is really a missing assertion belongs in
# the baseline's "real gaps" list instead.
exclude_re = [
    # These two `Debug` impls exist to REDACT secrets (header values, the
    # compaction API key). Replacing the body with an empty `Ok(())` prints
    # nothing at all — still redacted — so the only thing lost is the model id
    # in a log line. The inverse risk (printing a secret) is not a mutant
    # cargo-mutants can generate.
    '<impl std::fmt::Debug for ModelConfig>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)',
    '<impl std::fmt::Debug for LlmCompaction>::fmt -> std::fmt::Result with Ok\(Default::default\(\)\)',
    # Not survivors: these KILL THE CI RUNNER. `level2_summarize_old_turns`
    # advances with `i += 1` and pushes a summary or a cloned message on every
    # step. Turning any of its four increments into `-=` or `*=` makes the loop
    # revisit a message forever, pushing each time, so the test process grows
    # until the 16 GB runner is shut down ("The runner has received a shutdown
    # signal") before cargo-mutants' 60 s test timeout fires. That lost 4 of 8
    # shards in each of the first two CI runs. Any test that reaches level 2
    # would hang on them, so they are detected, not missed.
    'src/context.rs:\d+:\d+: replace \+= with (-=|\*=) in level2_summarize_old_turns',
    # Triage of the 2026-10-26 run (#198; docs/evals/mutation-baseline.md).
    # Each matches a whole function or a unique name, so it cannot hide a
    # real gap elsewhere; survivors that would need a line number to exclude
    # are recorded in the baseline instead.
    #
    # Log-only guards: the only `<` and `!=` in `compact_messages` decide
    # whether a `debug!` line prints; `with_max_summary_tokens` and
    # `with_trigger_ratio` compare only to `warn!` (the value is clamped
    # either way).
    'src/context.rs:\d+:\d+: replace < with (<=|==|>) in compact_messages$',
    'src/context.rs:\d+:\d+: replace != with == in compact_messages$',
    'src/llm_compaction.rs:\d+:\d+: replace < with (<=|==|>) in LlmCompaction::with_max_summary_tokens$',
    'src/llm_compaction.rs:\d+:\d+: replace != with == in LlmCompaction::with_trigger_ratio$',
    # `clip`'s back-off loop: `usize >= 0` is always true and byte 0 is
    # always a char boundary, so `>` → `>=` stops at the same place.
    'src/llm_compaction.rs:\d+:\d+: replace > with >= in clip$',
    # `InflightGuard::disarm` → (): the guard's `Drop` only resets an
    # in-flight phase the task has just replaced with `Ready`; it differs only
    # in a few-instruction race no test can schedule.
    'replace InflightGuard::disarm with \(\)',
    # `signature_hash` only feeds the in-process loop-detection set and is
    # never persisted: `^=` → `|=`/`&=` changes collision odds, not results.
    'src/context.rs:\d+:\d+: replace \^= with (\|=|&=) in signature_hash$',
    # Compat presets: deleting a field, or the whole body, that is set to its
    # `Default` value changes nothing. (They become real if a default moves.)
    'src/provider/model.rs:\d+:\d+: delete field supports_usage_in_streaming from struct Self expression in OpenAiCompat::(openai|meta|xai|groq|openrouter|mistral|deepseek|zai|minimax|qwen)$',
    'src/provider/model.rs:\d+:\d+: delete field max_tokens_field from struct Self expression in OpenAiCompat::(mistral|deepseek|qwen)$',
    'src/provider/model.rs:\d+:\d+: replace OpenAiCompat::(cerebras|mistral|zai|groq) -> Self with Default::default\(\)',
    # Preset fields equal to what the base constructor infers: `anthropic`
    # (`AnthropicCompat::for_claude_id(id)`), Haiku 4.5's 200K window (the
    # `anthropic()` default) and `gpt_6`'s `reasoning` (`openai_id_is_reasoning`
    # is true for every `gpt-6*` id).
    'src/provider/model.rs:\d+:\d+: delete field anthropic from struct Self expression in ModelConfig::claude_(fable_5_1|opus_5_5|opus_5|opus_4_8|sonnet_5|haiku_4_5|sonnet_5_5|haiku_5_5)$',
    'src/provider/model.rs:\d+:\d+: delete field context_window from struct Self expression in ModelConfig::claude_haiku_4_5$',
    'src/provider/model.rs:\d+:\d+: delete field reasoning from struct Self expression in ModelConfig::gpt_6$',
    # `with_loop_scope`'s `prompts` field: both callers pass `Vec::new()`,
    # the `Default`.
    'src/agent_loop.rs:\d+:\d+: delete field prompts from struct LoopScope expression in with_loop_scope$',
    # Prices: `diff_tables`' `(None, None)` arm is unreachable (keys come from
    # the two tables, and every listed entry has a cost); `is_zero` /
    # `is_false` only drop a default-valued field from serialized output.
    'src/provider/prices.rs:\d+:\d+: delete match arm \(None, None\) in diff_tables$',
    'src/provider/prices.rs:\d+:\d+: replace is_(zero|false) -> bool with false$',
]
