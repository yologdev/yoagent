name: CI

on:
  push:
    # `release/**` covers maintenance lines (e.g. 0.16.x carrying fixes without
    # main's queued breaking changes). Without it those branches ship with no
    # CI at all — 0.16.3 was released that way, verified only locally.
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Documentation
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --no-deps --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --all-features

      # Compiling an example does not prove it still shows what it claims.
      # These run offline on a scripted MockProvider and assert their own
      # outcome, so a behaviour change fails here (each takes well under a
      # second once built).
      - name: Run offline examples
        run: |
          for example in extension_policy extension_redact extension_verifier \
                         extension_budget extension_tree extension_audit; do
            echo "::group::$example"
            cargo run --all-features --example "$example"
            echo "::endgroup::"
          done

  # Every job above builds `--all-features`, but `openapi`, `gasp` and `decision` are all
  # off by default — so the feature set a `cargo add yoagent` user actually gets
  # was never compiled here. A `#[cfg(feature = ...)]` mistake that leaves an
  # import or a type reachable only with a feature on would pass all-features CI
  # and break on crates.io. One OS is enough: feature gating is not OS-specific.
  feature-combos:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: openapi
            flags: "--features openapi"
          - name: gasp
            flags: "--features gasp"
          - name: decision
            flags: "--features decision"
          # Native without the default `native` feature: the library, its
          # tests and examples must still build (targets that need the
          # feature declare `required-features = ["native"]`).
          - name: no-default
            flags: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.flags }}
      - name: Test
        run: cargo test ${{ matrix.flags }}

  # The agent loop without the `native` feature, as a Cloudflare Worker builds
  # it: lints, then runs `tests/wasm32.rs` under Node.
  wasm32:
    name: Check (wasm32, no default features)
    runs-on: ubuntu-latest
    # A broken timer or spawn shim hangs under Node rather than failing.
    timeout-minutes: 15
    env:
      # Bans calls that compile for wasm32 but panic there (std clocks, Tokio).
      CLIPPY_CONF_DIR: .github/clippy-wasm32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features
      - name: Clippy (decision)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features decision
      # Lint can't see code that compiles for wasm32 but panics or hangs there,
      # so `tests/wasm32.rs` runs under Node. The runner must match the
      # wasm-bindgen version this run resolved (Cargo.lock is not committed).
      - name: Install wasm-bindgen-test-runner
        run: |
          version=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Test (Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown --no-default-features --test wasm32

  # yoagent-workers (integrations/yoagent-workers): Cloudflare Workers bindings.
  # It exists only on wasm32, so it is linted for wasm32 and its tests run
  # under Node against fake bindings, like the core's wasm32 suite.
  workers-bindings:
    name: yoagent-workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MANIFEST: integrations/yoagent-workers/Cargo.toml
      # Absolute: clippy reads it from the nested package's directory.
      CLIPPY_CONF_DIR: ${{ github.workspace }}/.github/clippy-wasm32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            integrations/yoagent-workers
            integrations/yoagent-workers/examples/clef-worker
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --target wasm32-unknown-unknown --all-targets
      - name: Documentation
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path "$MANIFEST" --no-deps --target wasm32-unknown-unknown
      # The example Worker (its own workspace): it must keep compiling against
      # the code beside it. Type-checked and linted only; it is not built with
      # worker-build or run (that needs a Cloudflare account).
      - name: Example Worker (clef-worker)
        run: |
          cargo fmt --manifest-path integrations/yoagent-workers/examples/clef-worker/Cargo.toml -- --check
          cargo clippy --manifest-path integrations/yoagent-workers/examples/clef-worker/Cargo.toml --target wasm32-unknown-unknown
      # On other targets the crate is empty; keep that true (no stray
      # un-gated item) and its docs clean.
      - name: Native build and docs
        run: |
          cargo check --manifest-path "$MANIFEST"
          RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path "$MANIFEST" --no-deps
      - name: Install wasm-bindgen-test-runner
        run: |
          version=$(cargo metadata --manifest-path "$MANIFEST" --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Test (Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --manifest-path "$MANIFEST" --target wasm32-unknown-unknown

  # Built-in tools shell out to unix commands, so Windows only checks compilation.
  windows-check:
    name: Check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets --all-features

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      # resolver = "3" skips dependency versions whose declared rust-version is
      # too new, but a crate that declares none is taken at its newest.
      # yoke-derive 0.8.3 (2026-09-15, no rust-version) needs a std API newer
      # than 1.86; hold it at 0.8.2 here only — published consumers resolve
      # their own lockfile and are unaffected.
      - name: Pin transitive deps that dropped 1.86 without declaring it
        run: cargo update -p yoke-derive --precise 0.8.2
      - name: Check
        run: cargo check --all-features

  # The rutis bridge is its own crate (its own Cargo.toml, not a workspace
  # member, not in the published yoagent package). It depends on yoagent by
  # path, so it is built against this checkout; `rutis` is pinned exactly.
  rutis-bridge:
    name: yoagent-rutis bridge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MANIFEST: integrations/yoagent-rutis/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            integrations/yoagent-rutis
            integrations/yoagent-rutis/examples/rutis-agent-tools
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets
      - name: Documentation
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path "$MANIFEST" --no-deps
      - name: Test
        run: cargo test --manifest-path "$MANIFEST"
      - name: Example
        run: cargo run --manifest-path "$MANIFEST" --example policy_plugin
      # rutis-agent's tools through the bridge (its own workspace; rutis-agent
      # from git at rutis v0.8.0): one of the ecosystems the extensions guide
      # names, kept working here. Scripted, no network beyond the git fetch.
      - name: rutis-agent example
        run: cargo run --manifest-path integrations/yoagent-rutis/examples/rutis-agent-tools/Cargo.toml

  # The bridge declares rust-version 1.86 (yoagent's MSRV; the rutis 0.8
  # release train declares 1.85). Mirrors the `msrv` job above, including its
  # yoke-derive pin; the language features build there too.
  rutis-bridge-msrv:
    name: yoagent-rutis MSRV (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MANIFEST: integrations/yoagent-rutis/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/yoagent-rutis
      - name: Pin transitive deps that dropped 1.86 without declaring it
        run: |
          cargo generate-lockfile --manifest-path "$MANIFEST"
          cargo update --manifest-path "$MANIFEST" -p yoke-derive --precise 0.8.2
      - name: Check
        run: cargo check --manifest-path "$MANIFEST" --all-targets
      - name: Check with the language features (rutis-bridge 0.8)
        run: cargo check --manifest-path "$MANIFEST" --all-targets --features node,python,websocket

  # TypeScript and Python plugins through rutis-bridge 0.8, end to end: real
  # Node 24 and Python 3.12 runtimes load the example plugins and fixtures as
  # rutis-loader rows. The npm and PyPI packages are pinned to the 0.8.0
  # train (plugins/package-lock.json, plugins/requirements.txt). A missing
  # runtime fails the job instead of skipping (YOAGENT_RUTIS_REQUIRE_RUNTIMES).
  rutis-bridge-languages:
    name: yoagent-rutis TypeScript / Python plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MANIFEST: integrations/yoagent-rutis/Cargo.toml
      PLUGINS: integrations/yoagent-rutis/plugins
      YOAGENT_RUTIS_REQUIRE_RUNTIMES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/yoagent-rutis
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # npm's download cache (~/.npm), keyed on the three lockfiles: the
          # installs below (pi's alone is ~185 MB) stop re-downloading.
          cache: npm
          cache-dependency-path: |
            integrations/yoagent-rutis/plugins/package-lock.json
            integrations/yoagent-rutis/plugins/dsh/package-lock.json
            integrations/yoagent-rutis/plugins/pi/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the rutis npm packages
        run: npm ci --prefix "$PLUGINS"
      # The dsh adapter's end-to-end test (tests/dsh_test.rs): dsh-tools,
      # dsh-system-prompt and the adapter's other pins, in their own install.
      - name: Install the dsh npm packages
        run: npm ci --prefix "$PLUGINS/dsh"
      # The pi adapter's end-to-end test (tests/pi_test.rs): pi's own
      # packages (its extension loader, TypeBox), in their own install.
      - name: Install the pi npm packages
        run: npm ci --prefix "$PLUGINS/pi"
      - name: Install the rutis Python package
        run: |
          python -m venv "$PLUGINS/.venv"
          "$PLUGINS/.venv/bin/pip" install -r "$PLUGINS/requirements.txt"
      - name: Clippy (each language feature, and all)
        run: |
          for features in node python websocket node,python,websocket; do
            cargo clippy --manifest-path "$MANIFEST" --all-targets --features "$features"
          done
      - name: Documentation
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path "$MANIFEST" --no-deps --features node,python,websocket
      - name: Test
        run: cargo test --manifest-path "$MANIFEST" --features node,python,websocket
      - name: Example
        run: cargo run --manifest-path "$MANIFEST" --features node,python --example language_plugins
      - name: pi extensions example (scripted, the fixture extension)
        run: cargo run --manifest-path "$MANIFEST" --features node --example pi_extensions

  # EXPERIMENTAL: integrations/yoagent-frontend (not published). The session
  # and web tests need no Node; pi_dialog_test needs pi's packages (required
  # here). The example runs headless with three Node runtimes (the UI's, pi's
  # and DSH's packages) and checks that a pi extension's question reached the
  # terminal frontend and blocked `bash`.
  frontend-experimental:
    name: yoagent-frontend (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MANIFEST: integrations/yoagent-frontend/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/yoagent-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            integrations/yoagent-frontend/plugins/package-lock.json
            integrations/yoagent-rutis/plugins/dsh/package-lock.json
            integrations/yoagent-rutis/plugins/pi/package-lock.json
      - name: Install the npm packages
        run: |
          npm ci --prefix integrations/yoagent-frontend/plugins
          npm ci --prefix integrations/yoagent-rutis/plugins/pi
          npm ci --prefix integrations/yoagent-rutis/plugins/dsh
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets
      - name: Docs
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path "$MANIFEST" --no-deps
      - name: Test (pi's dialogs through the session need the runtimes)
        run: YOAGENT_RUTIS_REQUIRE_RUNTIMES=1 cargo test --manifest-path "$MANIFEST"
      - name: Page logic (node --test)
        run: node --test integrations/yoagent-frontend/web/lib.test.js
      - name: Example (scripted, headless; a pi dialog reaches the terminal UI)
        shell: bash
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-project" && cd "$RUNNER_TEMP/frontend-project"
          cargo run --manifest-path "$GITHUB_WORKSPACE/$MANIFEST" --example coding_agent -- --demo "clean the build" \
            | sed 's/\x1b\[[0-9;]*m//g' | tee screen.txt
          grep -q "? Run \`rm -rf build\`?" screen.txt
          grep -q "bash ✗" screen.txt

  # yoagent claims to be a tested GASP-conformant runtime — this job is the
  # test: emit an agent repo with the gasp bridge (mock provider, no network)
  # and run the protocol's conformance checker against it.
  gasp-conformance:
    name: GASP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Emit agent repo via the gasp bridge
        run: |
          git config --global user.email "ci@yolog.dev"
          git config --global user.name "yoagent-ci"
          cargo run --example gasp_emit --features gasp -- /tmp/emitted-repo
      - name: Checkout gasp (conformance checker)
        uses: actions/checkout@v4
        with:
          repository: yologdev/gasp
          # Pinned so a checker change cannot break yoagent CI silently — bump
          # deliberately, after running the job's sequence locally against the
          # new SHA. This one folds leniently (gasp#3): a dangling op is a note
          # on the certificate, not an abort, so check 2 now reports what it
          # skipped instead of failing the whole run at the first bad op.
          ref: 795bb93449adb206236a97d45d4dd674c0aae862
          path: gasp-checker
      - name: Run conformance checker against a fresh clone (true restore)
        run: |
          # GASP restore IS `git clone` — checking the emitting worktree would
          # pass on untracked scaffolding that a clone doesn't have.
          git clone -q /tmp/emitted-repo /tmp/restored-repo
          cd gasp-checker/conformance-check
          cargo run -q -- /tmp/restored-repo
