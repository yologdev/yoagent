name: CI

on:
  push:
    # `release/**` covers maintenance lines (e.g. 0.16.x carrying fixes without
    # main's queued breaking changes). Without it those branches ship with no
    # CI at all — 0.16.3 was released that way, verified only locally.
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt -- --check

      - name: Documentation
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --no-deps --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --all-features

  # Every job above builds `--all-features`, but `openapi`, `gasp` and `decision` are all
  # off by default — so the feature set a `cargo add yoagent` user actually gets
  # was never compiled here. A `#[cfg(feature = ...)]` mistake that leaves an
  # import or a type reachable only with a feature on would pass all-features CI
  # and break on crates.io. One OS is enough: feature gating is not OS-specific.
  feature-combos:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: openapi
            flags: "--features openapi"
          - name: gasp
            flags: "--features gasp"
          - name: decision
            flags: "--features decision"
          # Native without the default `native` feature: the library, its
          # tests and examples must still build (targets that need the
          # feature declare `required-features = ["native"]`).
          - name: no-default
            flags: "--no-default-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.flags }}
      - name: Test
        run: cargo test ${{ matrix.flags }}

  # The agent loop without the `native` feature, as a Cloudflare Worker builds
  # it. The wasm32 test runner is not wired up, so this lints only.
  wasm32:
    name: Check (wasm32, no default features)
    runs-on: ubuntu-latest
    env:
      # Bans calls that compile for wasm32 but panic there (std clocks, Tokio).
      CLIPPY_CONF_DIR: .github/clippy-wasm32
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features
      - name: Clippy (decision)
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features decision
      # Lint can't see code that compiles for wasm32 but panics or hangs there,
      # so `tests/wasm32.rs` runs under Node. The runner must match the
      # wasm-bindgen version this run resolved (Cargo.lock is not committed).
      - name: Install wasm-bindgen-test-runner
        run: |
          version=$(cargo metadata --format-version 1 \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Test (Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown --no-default-features --test wasm32

  # Built-in tools shell out to unix commands, so Windows only checks compilation.
  windows-check:
    name: Check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets --all-features

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      # resolver = "3" skips dependency versions whose declared rust-version is
      # too new, but a crate that declares none is taken at its newest.
      # yoke-derive 0.8.3 (2026-09-15, no rust-version) needs a std API newer
      # than 1.86; hold it at 0.8.2 here only — published consumers resolve
      # their own lockfile and are unaffected.
      - name: Pin transitive deps that dropped 1.86 without declaring it
        run: cargo update -p yoke-derive --precise 0.8.2
      - name: Check
        run: cargo check --all-features

  # The rutis bridge is its own crate (its own Cargo.toml, not a workspace
  # member, not in the published yoagent package). It depends on yoagent by
  # path, so it is built against this checkout; `rutis` is pinned exactly.
  rutis-bridge:
    name: yoagent-rutis bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MANIFEST: integrations/yoagent-rutis/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/yoagent-rutis
      - name: Format
        run: cargo fmt --manifest-path "$MANIFEST" -- --check
      - name: Clippy
        run: cargo clippy --manifest-path "$MANIFEST" --all-targets
      - name: Documentation
        run: RUSTDOCFLAGS="-Dwarnings" cargo doc --manifest-path "$MANIFEST" --no-deps
      - name: Test
        run: cargo test --manifest-path "$MANIFEST"
      - name: Example
        run: cargo run --manifest-path "$MANIFEST" --example policy_plugin

  # The bridge declares rust-version 1.86 (yoagent's MSRV; rutis 0.5 declares
  # 1.85). Mirrors the `msrv` job above, including its yoke-derive pin.
  rutis-bridge-msrv:
    name: yoagent-rutis MSRV (1.86)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MANIFEST: integrations/yoagent-rutis/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/yoagent-rutis
      - name: Pin transitive deps that dropped 1.86 without declaring it
        run: |
          cargo generate-lockfile --manifest-path "$MANIFEST"
          cargo update --manifest-path "$MANIFEST" -p yoke-derive --precise 0.8.2
      - name: Check
        run: cargo check --manifest-path "$MANIFEST" --all-targets

  # yoagent claims to be a tested GASP-conformant runtime — this job is the
  # test: emit an agent repo with the gasp bridge (mock provider, no network)
  # and run the protocol's conformance checker against it.
  gasp-conformance:
    name: GASP conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Emit agent repo via the gasp bridge
        run: |
          git config --global user.email "ci@yolog.dev"
          git config --global user.name "yoagent-ci"
          cargo run --example gasp_emit --features gasp -- /tmp/emitted-repo
      - name: Checkout gasp (conformance checker)
        uses: actions/checkout@v4
        with:
          repository: yologdev/gasp
          # Pinned so a checker change cannot break yoagent CI silently — bump
          # deliberately, after running the job's sequence locally against the
          # new SHA. This one folds leniently (gasp#3): a dangling op is a note
          # on the certificate, not an abort, so check 2 now reports what it
          # skipped instead of failing the whole run at the first bad op.
          ref: 795bb93449adb206236a97d45d4dd674c0aae862
          path: gasp-checker
      - name: Run conformance checker against a fresh clone (true restore)
        run: |
          # GASP restore IS `git clone` — checking the emitting worktree would
          # pass on untracked scaffolding that a clone doesn't have.
          git clone -q /tmp/emitted-repo /tmp/restored-repo
          cd gasp-checker/conformance-check
          cargo run -q -- /tmp/restored-repo
